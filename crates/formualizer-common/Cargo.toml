[package]
name = "formualizer-common"
version = "3.1.0"
edition = "2024"
description = "Core value, reference, and error types shared across the Formualizer parser and engine"
homepage.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["spreadsheet", "excel", "types", "cell", "reference"]
categories = ["data-structures"]

[features]
default = []
serde = ["dep:serde"]
# 32-bit row packing (full u32 range) instead of Excel's 20-bit row limit.
wide-rows = []

[dependencies]
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, optional = true, features = ["derive"] }
